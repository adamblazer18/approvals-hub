name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t approvals-hub .
      - name: Container starts and answers /health
        run: |
          docker run -d --name hub -p 3060:3060 -e ADMIN_PASSWORD=ci-password approvals-hub
          for i in $(seq 1 30); do curl -fs http://localhost:3060/health && exit 0; sleep 1; done
          docker logs hub; exit 1
