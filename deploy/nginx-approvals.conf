# /etc/nginx/sites-available/approvals  → ln -s into sites-enabled, then: certbot --nginx -d approvals.example.com
server {
    listen 80;
    server_name approvals.example.com;

    client_max_body_size 75m;   # base64 uploads are ~1.35x the file size

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;    # MCP streaming responses
    }
}
